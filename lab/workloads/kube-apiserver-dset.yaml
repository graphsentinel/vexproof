# Workload profile "c12 D-set" for kube-apiserver v1.28.2 (exercise layer P3, plan §10): c12's original kubectl input
# set (evidence/reference/c0-apiserver-v1.28.2/det.sh: every kubectl subcommand's --help, then the listed operations)
# plus the service proxy to the HTML backend, run against the rebuild with the EXTENDED coverpkg. Its only purpose is to
# separate the effect of the instrumentation change from the effect of the new workload profile. Exit codes are not
# part of the D-set (c12 discarded them): every command is recorded, expect: any is deliberate here and stated.
name: kube-apiserver-dset
version: 1
dset: true
unexercised:
- everything outside c12's D-set
not_applicable: []
etcd:
  v1.28.2: registry.k8s.io/etcd:3.5.9-0@sha256:e013d0d5e4e25d00c61a7ff839927a1f36479678f11e49502b53a5e0b14f10c3
  v1.36.5: registry.k8s.io/etcd:3.6.8-0@sha256:397189418d1a00e500c0605ad18d1baf3b541a1004d768448c367e48071622e5
backend: docker.io/library/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
backend_fixture:
- id: default-sa
  cmd: '{k} -n default create serviceaccount default'
  expect: 0
- id: backend-objects
  cmd: '{k} apply -f {d}/backend.yaml'
  expect: 0
- id: backend-pod-status
  cmd: '{k} -n default patch pod htmlpod --subresource=status --type=merge -p ''{"status":{"phase":"Running","podIP":"{backend_ip}","podIPs":[{"ip":"{backend_ip}"}]}}'''
  expect: 0
- id: backend-endpoints
  cmd: '{k} apply -f {d}/endpoints.yaml'
  expect: 0
