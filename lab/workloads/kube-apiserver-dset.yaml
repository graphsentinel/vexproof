requests:
- id: service-proxy
  method: GET
  path: /api/v1/namespaces/default/services/htmlsvc:http/proxy/hostname
  status: 200
  needs: backend
files:
  cm.yaml: 'apiVersion: v1

    kind: ConfigMap

    metadata: {name: demo, namespace: team-a}

    data: {page: "<html><body><p>hello</p></body></html>"}

    '
  backend.yaml: 'apiVersion: v1

    kind: Pod

    metadata: {name: htmlpod, namespace: default}

    spec: {containers: [{name: c, image: "{img}"}]}

    ---

    apiVersion: v1

    kind: Service

    metadata: {name: htmlsvc, namespace: default}

    spec: {ports: [{name: http, port: 80, targetPort: 8080, protocol: TCP}]}

    '
  endpoints.yaml: 'apiVersion: v1

    kind: Endpoints

    metadata: {name: htmlsvc, namespace: default}

    subsets: [{addresses: [{ip: "{backend_ip}", targetRef: {kind: Pod, name: htmlpod, namespace: default}}], ports: [{name: http, port: 8080, protocol: TCP}]}]

    ---

    apiVersion: discovery.k8s.io/v1

    kind: EndpointSlice

    metadata: {name: htmlsvc-1, namespace: default, labels: {kubernetes.io/service-name: htmlsvc}}

    addressType: IPv4

    endpoints: [{addresses: ["{backend_ip}"], conditions: {ready: true}, targetRef: {kind: Pod, name: htmlpod, namespace: default}}]

    ports: [{name: http, port: 8080, protocol: TCP}]

    '
  csr.yaml: "apiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata: {name: lab-csr}\nspec:\n  request: \"{csr_b64}\"\n  signerName: kubernetes.io/kube-apiserver-client\n  usages:\
    \ [client auth]\n"
